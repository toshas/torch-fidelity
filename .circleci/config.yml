version: 2.1

executors:
  executor_python:
    docker:
      - image: cimg/python:3.11.7
    resource_class: large
    working_directory: /tmp

jobs:
  smoke_tests:
    executor: executor_python
    steps:
      - checkout:
          path: code
      - run:
          name: Create virtual environment
          command: |
            pip3 install -U pip
            pip3 install -U numpy pillow tqdm torch torchvision psutil
      - run:
          name: Download datasets
          command: |
            curl -fsSL --retry 5 --retry-delay 10 --max-time 300 https://github.com/toshas/torch-fidelity/releases/download/ci-assets/cifar10-256-subsets.tar.gz | tar xz
      - run:
          name: Smoke tests
          no_output_timeout: 60m
          command: |
            cd code && CUDA_VISIBLE_DEVICES="" PYTHONPATH=. python3 ./.circleci/smoke_tests.py
      - run:
          name: PRC convention test
          command: |
            cd code && CUDA_VISIBLE_DEVICES="" PYTHONPATH=. python3 -m unittest tests.torch_pure.misc.test_prc_convention -v

workflows:
  version: 2
  venv_and_tests:
    jobs:
      - smoke_tests
  mondays:
    triggers:
      - schedule:
          cron: "0 0 * * 1"
          filters:
            branches:
              only:
                - master
    jobs:
      - smoke_tests
